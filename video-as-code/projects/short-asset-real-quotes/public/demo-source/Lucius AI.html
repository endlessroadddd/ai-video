Lucius AI 全面介绍（详细版）
━━━━━━━━━━━━━━━━━━━━━━

一、是什么

Lucius 是一个 AI 驱动的"客户成功 + 社区运营"平台，核心理念是：让软件像队友一样工作，而不只是一个工具。

它不是传统聊天机器人，不是简单的自动回复脚本，而是一个能跨平台、跨场景独立工作的 AI 专员，像一名真正的全职员工融入团队，能感知上下文、做判断、执行动作、汇报结果。

当前最新版本：Lucius 2.0


━━━━━━━━━━━━━━━━━━━━━━
二、能做什么（核心能力模块）
━━━━━━━━━━━━━━━━━━━━━━

1. 全渠道用户响应
支持 Discord、Telegram、Slack、飞书（Feishu）、网站 Widget 等主流平台，统一接入、统一管理。用户在哪个平台提问，Lucius 就在哪里响应，无需人工值守。

2. 知识库驱动的精准问答
Lucius 不是靠通用大模型"猜答案"，而是基于企业自建知识库回答问题。知识来源包括：
- PDF / 文档
- 历史对话（Session）
- FAQ / QA-JSON
- 事件记录（Event）

所有知识经过结构化提炼、向量化存储，检索时采用"向量检索 + 关键词全文检索"双路混合，再经 Rerank 精排，确保答案准确、有依据。

3. 商机识别与自动转交
当用户表达询价、预约演示、合作咨询等商务意向时，Lucius 会：
- 主动引导用户留下联系方式（优先邮箱）
- 自动创建工单记录需求
- 在飞书群通知相关负责人跟进
- 向用户确认"已安排专人联系"
全程不遗漏任何商机信号。

4. 用户成功管理
- 引导新用户完成关键操作
- 识别使用不充分的客户并主动介入
- 监测用户满意度与情绪变化
- 识别流失风险并预警

5. 知识自动沉淀
每次对话中，Lucius 会自动识别有价值的新信息（如 Staff 回复中的业务规则、解决方案），静默写入知识库，持续进化，不需要人工手动维护。

6. 事件与工单管理
遇到无法自动处理的问题（Bug 反馈、复杂投诉、大额商务），Lucius 会自动创建结构化工单，分类标注优先级，并通知对应负责人，确保问题不丢失。

7. 内部团队协作
Lucius 不只面向外部用户，也是内部团队的助手：
- 执行 Staff 的指令（查信息、发消息、记录、更新配置）
- 在飞书等内部平台以"同事"身份协作
- 汇报任务执行结果，不静默消失


━━━━━━━━━━━━━━━━━━━━━━
三、技术架构（端到端流程）
━━━━━━━━━━━━━━━━━━━━━━

数据入库流程：
数据源（PDF/对话/FAQ/Event）
→ 解析 &amp; 清洗 &amp; 切分
→ 结构化提炼（生成 key / text / answer / tags / aliases）
→ 1536 维 Embedding 向量化
→ 智能去重写入（smart_knowledge_upsert）
→ 统一知识表（knowledge_data）

检索流程：
用户提问
→ 向量检索 + 关键词 FTS 双路并行
→ Rerank 精排（Top15 → Top6）
→ FastAPI 对外返回结果

常驻系统组件：
① Knowledge Engine API（FastAPI 常驻运行）
② Session 增量同步任务（周期性抓取新对话，提炼后入库）
③ PDF 入库流水线（按需批量导入文档）

多租户隔离：
每个企业通过 company_id 完全隔离数据，互不干扰。
