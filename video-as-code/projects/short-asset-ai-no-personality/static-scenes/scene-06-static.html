<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Scene 06</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: #1e1f22;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    .text-block {
      display: grid;
      gap: 12px;
      text-align: center;
    }
    .line1 {
      color: rgba(255, 255, 255, 0.94);
      font-size: 58px;
      font-weight: 400;
      line-height: 1.36;
      letter-spacing: -0.04em;
    }
    .line2 {
      color: rgba(255, 255, 255, 0.68);
      font-size: 54px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <div class="text-block">
    <div class="line1">AI 不会破坏沉浸感——</div>
    <div class="line2">如果它真的懂你的社群。</div>
  </div>
</body>
</html>
