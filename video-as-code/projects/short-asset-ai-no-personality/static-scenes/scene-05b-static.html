<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Scene 05B</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(88, 101, 242, 0.12), transparent 30%),
        linear-gradient(180deg, #17181c 0%, #1e1f22 40%, #111214 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      overflow: hidden;
      color: #f2f3f5;
    }
    .card {
      width: 960px;
      padding: 42px 48px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: rgba(35, 36, 40, 0.98);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.42);
    }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      align-items: flex-start;
    }
    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #949ba4;
      font-weight: 700;
    }
    .title {
      margin: 0;
      max-width: 560px;
      font-size: 34px;
      line-height: 1.16;
      letter-spacing: -0.05em;
      font-weight: 700;
      color: #ffffff;
    }
    .impact {
      text-align: right;
    }
    .impact strong {
      display: block;
      color: #ed4245;
      font-size: 68px;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }
    .impact span {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #b5bac1;
    }
    .chart {
      position: relative;
      height: 320px;
      margin-top: 34px;
    }
    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .grid-line span {
      position: absolute;
      right: calc(100% + 18px);
      transform: translateY(50%);
      font-size: 13px;
      color: #6f757d;
    }
    .chart-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .labels {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 13px;
      color: #6f757d;
    }
    .labels .highlight {
      color: #ff8e91;
      font-weight: 700;
    }
    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 30px;
    }
    .metric {
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .metric strong {
      display: block;
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .metric span {
      font-size: 14px;
      line-height: 1.5;
      color: #b5bac1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <p class="eyebrow">活跃用户趋势</p>
        <h1 class="title">AI 接入后，沉浸感先断，人再开始流失。</h1>
      </div>
      <div class="impact">
        <strong>-71%</strong>
        <span>AI 上线后 3 周内</span>
      </div>
    </div>

    <div class="chart">
      <div class="grid-line" style="top: 0%"><span>250</span></div>
      <div class="grid-line" style="top: 33.3%"><span>165</span></div>
      <div class="grid-line" style="top: 66.6%"><span>80</span></div>
      <div class="grid-line" style="top: 100%"><span>0</span></div>

      <svg class="chart-svg" viewBox="0 0 800 320" preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(237, 66, 69, 0.28)"/>
            <stop offset="100%" stop-color="rgba(237, 66, 69, 0.02)"/>
          </linearGradient>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#23a55a"/>
            <stop offset="32%" stop-color="#23a55a"/>
            <stop offset="40%" stop-color="#ed4245"/>
            <stop offset="100%" stop-color="#ed4245"/>
          </linearGradient>
        </defs>

        <path
          d="M 0 15 C 66 19 100 26 133 38 C 200 54 233 76 266 94 C 333 132 366 179 400 213 C 466 266 566 293 800 310 L 800 320 L 0 320 Z"
          fill="url(#areaGrad)"
        />

        <path
          d="M 0 15 C 66 19 100 26 133 38 C 200 54 233 76 266 94 C 333 132 366 179 400 213 C 466 266 566 293 800 310"
          fill="none"
          stroke="url(#lineGrad)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <line x1="266" y1="0" x2="266" y2="320" stroke="rgba(237,66,69,0.55)" stroke-width="2" stroke-dasharray="8 6" />
        <circle cx="0" cy="15" r="6" fill="#23a55a" />
        <circle cx="266" cy="94" r="6" fill="#ed4245" />
        <circle cx="800" cy="310" r="7" fill="#ed4245" />

        <rect x="282" y="16" width="110" height="28" rx="8" fill="rgba(237,66,69,0.16)" />
        <text x="337" y="35" text-anchor="middle" fill="#ff8e91" font-size="13" font-weight="700">AI 接入点</text>
        <text x="790" y="293" text-anchor="end" fill="#ff8e91" font-size="14" font-weight="700">71</text>
      </svg>
    </div>

    <div class="labels">
      <span>第1周</span>
      <span>第2周</span>
      <span class="highlight">第3周（接入）</span>
      <span>第4周</span>
      <span>第5周</span>
      <span>第6周</span>
      <span>第7周</span>
    </div>

    <div class="footer">
      <div class="metric">
        <strong>从 248 到 71</strong>
        <span>不是一两个人走，是整段社区氛围被抽空。</span>
      </div>
      <div class="metric">
        <strong>该社区 AI 上线后 3 周内数据</strong>
        <span>先是角色感断裂，再是成员离开，最后才体现在活跃数字上。</span>
      </div>
    </div>
  </div>
</body>
</html>
