<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Scene 01</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: #111214;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    .text-block {
      display: grid;
      gap: 14px;
      text-align: center;
    }
    .line {
      color: rgba(255, 255, 255, 0.94);
      font-size: 62px;
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.38;
    }
    .line--muted {
      color: rgba(255, 255, 255, 0.72);
    }
  </style>
</head>
<body>
  <div class="text-block">
    <div class="line">有些社群，把 AI 放进去之后</div>
    <div class="line line--muted">用户开始消失</div>
  </div>
</body>
</html>
