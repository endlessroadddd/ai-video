<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framework - The Great Flattening</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f1ea;
      --surface: #fffdfa;
      --surface-strong: #f4efe8;
      --ink: #334363;
      --ink-soft: #56627f;
      --muted: #928ba6;
      --line: #e8e0eb;
      --line-strong: #d8cede;
      --accent: #6952c8;
      --accent-soft: #ede7ff;
      --accent-border: rgba(105, 82, 200, 0.22);
      --red: #a55d86;
      --red-soft: #f6eaf1;
      --red-border: rgba(165, 93, 134, 0.18);
      --blue: #7b76dc;
      --blue-soft: #ecebff;
      --blue-border: rgba(123, 118, 220, 0.18);
      --dot: rgba(86, 98, 127, 0.12);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    svg {
      display: block;
    }

    .icon {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .section {
      position: relative;
      padding: 96px 0;
    }

    .section-inner,
    .section-nav,
    .section-divider {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 56px;
    }

    .section-divider {
      margin-bottom: 40px;
    }

    .section-divider hr {
      border: 0;
      border-top: 1px solid var(--line);
    }

    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 52px;
      opacity: 0;
    }

    .section-nav .left {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-nav .left span {
      color: var(--line-strong);
      margin-right: 8px;
    }

    .section-nav .right {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .framework-header {
      margin-bottom: 72px;
    }

    .framework-header h2 {
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: -0.05em;
      font-weight: 800;
      max-width: 760px;
    }

    .framework-header h2 em {
      font-style: normal;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .framework-diagram {
      display: grid;
      grid-template-columns: 1fr 104px 1fr;
      align-items: center;
      padding: 40px 0 8px;
    }

    .trad-hierarchy,
    .flat-net {
      background: var(--surface-strong);
      border: 1px solid var(--line);
      padding: 32px;
    }

    .trad-label,
    .flat-label {
      margin-bottom: 22px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .trad-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 10px 0;
    }

    .trad-node,
    .flat-spoke,
    .flat-hub {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .trad-hierarchy,
    .flat-net {
      background: transparent;
      border: 0;
      padding: 18px 0 0;
    }

    .visual-panel {
      background: var(--surface-strong);
      border: 1px solid var(--line);
      padding: 32px;
    }

    .trad-node {
      width: 34px;
      height: 34px;
      color: var(--ink-soft);
    }

    .trad-node .icon,
    .flat-spoke .icon,
    .flat-hub .icon,
    .trad-loss .icon,
    .flat-win .icon {
      width: 26px;
      height: 26px;
      stroke-width: 1.8;
    }

    .trad-node.l1,
    .flat-spoke.s1 {
      color: var(--accent);
    }

    .trad-node.l2,
    .flat-spoke.s2,
    .flat-spoke.s6 {
      color: var(--blue);
    }

    .trad-node.l3,
    .flat-spoke.s3,
    .flat-spoke.s5 {
      color: #b184b4;
    }

    .trad-node.l4,
    .flat-spoke.s4 {
      color: #a6afc2;
    }

    .trad-connector {
      width: 1px;
      height: 22px;
      margin: 0 auto;
      background: repeating-linear-gradient(to bottom, rgba(165, 93, 134, 0.72) 0 4px, transparent 4px 10px);
    }

    .trad-loss,
    .flat-win,
    .scenario-callout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .trad-loss,
    .flat-win {
      margin-top: 18px;
      padding: 0;
      background: transparent;
      border: 0;
      justify-content: center;
    }

    .trad-loss {
      color: var(--red);
      width: max-content;
      max-width: 100%;
      margin-inline: auto;
    }

    .trad-loss .trend-badge,
    .flat-win .pulse-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: currentColor;
    }

    .trad-loss .icon,
    .flat-win .icon,
    .scenario-callout .icon {
      width: 16px;
      height: 16px;
    }

    .flat-win {
      color: var(--accent);
    }

    .arrow-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .arrow-tag {
      padding: 6px 12px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .arrow-line-h {
      width: 72px;
      height: 2px;
      background: var(--ink);
      position: relative;
    }

    .arrow-line-h::after {
      content: '';
      position: absolute;
      right: -5px;
      top: -4px;
      border: 5px solid transparent;
      border-left-color: var(--ink);
    }

    .flat-net {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flat-circle {
      width: 224px;
      height: 224px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flat-circle::before {
      content: '';
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 1px dashed rgba(123, 118, 220, 0.24);
    }

    .flat-links {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flow-line {
      --flow-length: 74px;
      --flow-travel: 72px;
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--flow-length);
      height: 1px;
      transform-origin: 0 50%;
      background: rgba(105, 82, 200, 0.26);
      opacity: 1;
    }

    .flow-line::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      transform: translate(-50%, -50%) translateX(10px) scale(0.7);
      background: var(--accent);
      opacity: 0;
    }

    .flow-line.l1 {
      transform: rotate(-90deg);
    }

    .flow-line.l2 {
      transform: rotate(-30deg);
    }

    .flow-line.l3 {
      transform: rotate(30deg);
    }

    .flow-line.l4 {
      transform: rotate(90deg);
    }

    .flow-line.l5 {
      transform: rotate(150deg);
    }

    .flow-line.l6 {
      transform: rotate(210deg);
    }

    .flat-hub {
      width: 66px;
      height: 66px;
      position: relative;
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .hub-aura,
    .hub-ring,
    .hub-core,
    .hub-orbit {
      content: none;
      display: none;
    }

    .hub-ring {
      position: absolute;
      border-radius: 50%;
    }

    .hub-ring.outer {
      inset: 0;
      border: 1.5px solid rgba(105, 82, 200, 0.44);
    }

    .hub-ring.inner {
      inset: 10px;
      border: 1px solid rgba(105, 82, 200, 0.22);
    }

    .flat-spoke {
      width: 34px;
      height: 34px;
      position: absolute;
    }

    .flat-spoke.s1 {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .flat-spoke.s2 {
      top: 24%;
      right: 16px;
    }

    .flat-spoke.s3 {
      bottom: 24%;
      right: 16px;
    }

    .flat-spoke.s4 {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .flat-spoke.s5 {
      bottom: 24%;
      left: 16px;
    }

    .flat-spoke.s6 {
      top: 24%;
      left: 16px;
    }
  </style>
</head>
