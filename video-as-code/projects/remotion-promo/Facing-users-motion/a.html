<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM 场景 - Implied Insights</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f1ea;
      --surface: #fffdfa;
      --surface-strong: #f4efe8;
      --ink: #334363;
      --ink-soft: #56627f;
      --muted: #928ba6;
      --line: #e8e0eb;
      --line-strong: #d8cede;
      --accent: #6952c8;
      --accent-soft: #ede7ff;
      --accent-border: rgba(105, 82, 200, 0.22);
      --red: #a55d86;
      --red-soft: #f6eaf1;
      --red-border: rgba(165, 93, 134, 0.18);
      --blue: #7b76dc;
      --blue-soft: #ecebff;
      --blue-border: rgba(123, 118, 220, 0.18);
      --orange: #ab815b;
      --orange-soft: #f8efe5;
      --orange-border: rgba(171, 129, 91, 0.18);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    svg {
      display: block;
    }

    .icon {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .section {
      position: relative;
      padding: 96px 0;
    }

    .section-inner,
    .section-nav,
    .section-divider {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 56px;
    }

    .section-divider {
      margin-bottom: 40px;
    }

    .section-divider hr {
      border: 0;
      border-top: 1px solid var(--line);
    }

    .section-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 52px;
    }

    .section-nav .left {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-nav .left span {
      color: var(--line-strong);
      margin-right: 8px;
    }

    .section-nav .right {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pm-reframe .scenario-block {
      display: none !important;
    }

    .pm-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(72px, 8vw, 112px);
      align-items: start;
    }

    .pm-column {
      min-width: 0;
    }

    .pm-kicker {
      display: inline-flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .pm-column-why .pm-kicker {
      color: var(--orange);
    }

    .pm-display {
      margin-bottom: 34px;
      font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
      font-size: clamp(28px, 3.2vw, 42px);
      line-height: 1.25;
      letter-spacing: -0.04em;
      font-weight: 500;
      color: #1e2026;
    }

    .pm-diagram-panel {
      padding: 28px;
      border: 1px solid rgba(105, 82, 200, 0.2);
      background: rgba(255, 253, 250, 0.44);
    }

    .pm-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .pm-svg text {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      dominant-baseline: middle;
    }

    .pm-stage-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .pm-node-label {
      fill: var(--ink-soft);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .pm-node-label.small {
      font-size: 11px;
    }

    .pm-box {
      fill: rgba(255, 253, 250, 0.64);
      stroke-width: 2;
    }

    .pm-box.accent {
      stroke: var(--accent);
    }

    .pm-box.muted {
      fill: rgba(255, 253, 250, 0.56);
      stroke: rgba(146, 139, 166, 0.34);
    }

    .pm-node-box {
      fill: rgba(255, 253, 250, 0.74);
      stroke-width: 1.75;
    }

    .pm-node-box.accent {
      stroke: rgba(105, 82, 200, 0.42);
    }

    .pm-node-box.muted {
      stroke: rgba(146, 139, 166, 0.3);
    }

    .pm-box-red {
      stroke: var(--red-border) !important;
    }

    .pm-box-accent-dim {
      stroke: var(--accent-border) !important;
    }

    .pm-pill {
      fill: rgba(255, 253, 250, 0.76);
      stroke: rgba(105, 82, 200, 0.24);
      stroke-width: 1.5;
    }

    .pm-pill-text {
      fill: var(--ink-soft);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .pm-line {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pm-line.accent {
      stroke: var(--accent);
    }

    .pm-line.subtle {
      stroke: rgba(105, 82, 200, 0.44);
    }

    .pm-line.muted {
      stroke: rgba(146, 139, 166, 0.34);
    }

    .pm-joint {
      fill: var(--accent);
    }

    .pm-joint.muted {
      fill: rgba(146, 139, 166, 0.46);
    }

    .pm-source-dot.red {
      fill: var(--red);
    }

    .pm-source-dot.blue {
      fill: var(--blue);
    }

    .pm-source-dot.orange {
      fill: var(--orange);
    }

    .pm-source-dot.accent {
      fill: var(--accent);
    }

    .pm-user-dot {
      fill: rgba(105, 82, 200, 0.12);
      stroke: rgba(105, 82, 200, 0.34);
      stroke-width: 1.75;
    }

    .pm-user-text {
      fill: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .pm-logo-use {
      color: var(--accent);
    }

    .pm-caption {
      margin-top: 26px;
      font-size: clamp(14px, 1.35vw, 17px);
      line-height: 1.88;
      color: var(--ink-soft);
    }

    .pm-outcome-strip {
      margin-top: 72px;
      padding-top: 26px;
      border-top: 1px solid rgba(105, 82, 200, 0.18);
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) auto;
      gap: 20px 28px;
      align-items: start;
    }

    .pm-outcome-strip .pm-kicker {
      margin: 4px 0 0;
    }

    .pm-outcome-copy {
      max-width: 720px;
      font-size: clamp(16px, 1.6vw, 20px);
      line-height: 1.72;
      color: var(--ink);
    }

    .pm-outcome-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
    }

    .pm-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid rgba(105, 82, 200, 0.18);
      background: rgba(237, 231, 255, 0.52);
      color: var(--ink);
      font-size: 13px;
      line-height: 1;
    }

    .pm-chip strong {
      font-size: 13px;
      font-weight: 700;
    }

    .pm-chip em {
      font-style: normal;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .pm-chip.p0 {
      border-color: rgba(165, 93, 134, 0.22);
      background: rgba(246, 234, 241, 0.64);
    }

    .pm-chip.p0 em {
      color: var(--red);
    }

    .pm-chip.p1 {
      border-color: rgba(171, 129, 91, 0.2);
      background: rgba(248, 239, 229, 0.7);
    }

    .pm-chip.p1 em {
      color: var(--orange);
    }

    .pm-chip.p2 {
      border-color: rgba(123, 118, 220, 0.18);
      background: rgba(236, 235, 255, 0.68);
    }

    .pm-chip.p2 em {
      color: var(--blue);
    }

    .scenario-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
      margin-bottom: 96px;
    }

    .scenario-block:last-child {
      margin-bottom: 0;
    }

    .scenario-block.reverse {
      direction: rtl;
    }

    .scenario-block.reverse > * {
      direction: ltr;
    }

    .scenario-text {
      padding-top: 18px;
    }

    .scenario-tag {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      margin-bottom: 18px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .scenario-tag.why {
      background: var(--red-soft);
      color: var(--red);
      border-color: var(--red-border);
    }

    .scenario-tag.how {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: var(--blue-border);
    }

    .scenario-tag.what {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .scenario-title {
      margin-bottom: 18px;
      font-size: clamp(28px, 3vw, 36px);
      line-height: 1.18;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .scenario-desc {
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink-soft);
    }

    .scenario-callout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .scenario-callout .icon {
      width: 16px;
      height: 16px;
    }

    .visual-panel {
      overflow: hidden;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      padding: 32px;
    }

    .chat-sim {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      display: flex;
      gap: 10px;
      opacity: 0;
      transform: translateY(14px);
    }

    .chat-msg.right {
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-avatar .icon {
      width: 17px;
      height: 17px;
    }

    .chat-msg.ai .chat-avatar,
    .chat-avatar.agent {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .chat-avatar.alert {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red);
    }

    .chat-bubble {
      max-width: 78%;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12.5px;
      line-height: 1.68;
      color: var(--ink-soft);
    }

    .chat-msg.ai .chat-bubble {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--ink);
    }

    .chat-bubble.danger {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red);
      font-style: normal;
      font-weight: 600;
    }

    .signal-panel {
      display: grid;
      grid-template-columns: 1fr 32px 1fr;
      gap: 12px;
      align-items: center;
    }

    .signal-list,
    .signal-output {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .signal-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
    }

    .signal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .signal-dot.red {
      background: var(--red);
    }

    .signal-dot.blue {
      background: var(--blue);
    }

    .signal-dot.orange {
      background: var(--orange);
    }

    .signal-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .bridge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .insight-card {
      padding: 14px 16px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
    }

    .insight-card .tag {
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .insight-card .body {
      font-size: 12.5px;
      line-height: 1.62;
      color: var(--ink);
    }

    .req-board {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .req-board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .req-badge {
      padding: 4px 10px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .req-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .req-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
    }

    .req-icon .icon {
      width: 15px;
      height: 15px;
    }

    .req-icon.p0,
    .req-priority.p0 {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red);
    }

    .req-icon.p1,
    .req-priority.p1 {
      background: var(--orange-soft);
      border-color: var(--orange-border);
      color: var(--orange);
    }

    .req-icon.p2,
    .req-priority.p2 {
      background: var(--blue-soft);
      border-color: var(--blue-border);
      color: var(--blue);
    }

    .req-info {
      flex: 1;
      min-width: 0;
    }

    .req-name {
      margin-bottom: 2px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .req-meta {
      font-size: 11px;
      color: var(--muted);
    }

    .req-priority {
      padding: 4px 10px;
      border: 1px solid transparent;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideL {
      from {
        opacity: 0;
        transform: translateX(-16px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideR {
      from {
        opacity: 0;
        transform: translateX(16px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1100px) {
      .pm-grid {
        gap: 56px;
      }
      .pm-display {
        font-size: clamp(28px, 3.4vw, 48px);
      }
      .pm-diagram-panel {
        padding: 22px;
      }
      .pm-outcome-strip {
        grid-template-columns: 1fr;
      }
      .pm-outcome-chips {
        justify-content: flex-start;
      }
    }

    @media (max-width: 900px) {
      .pm-grid {
        gap: 44px;
      }
      .pm-kicker {
        margin-bottom: 16px;
      }
      .pm-display {
        margin-bottom: 24px;
        font-size: clamp(34px, 4vw, 48px);
      }
      .pm-caption {
        margin-top: 20px;
        font-size: 16px;
      }
      .pm-outcome-strip {
        margin-top: 56px;
      }
    }
  </style>
</head>
